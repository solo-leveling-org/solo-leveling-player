databaseChangeLog:
  - changeSet:
      id: create-gacha-machines-table
      author: sleepkqq
      changes:
        - createTable:
            tableName: gacha_machine
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: localized_name_id
                  type: uuid
              - column:
                  name: localized_description_id
                  type: uuid
              - column:
                  name: cost_amount
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: cost_currency_code
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: pull_count
                  type: integer
                  defaultValue: 1
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: version
                  type: integer
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: gacha_machine
            baseColumnNames: localized_name_id
            constraintName: fk_gacha_machine_name
            referencedTableName: localization_item
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: gacha_machine
            baseColumnNames: localized_description_id
            constraintName: fk_gacha_machine_description
            referencedTableName: localization_item
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: gacha_machine

  - changeSet:
      id: create-gacha-machine-items-table
      author: sleepkqq
      changes:
        - createTable:
            tableName: gacha_machine_item
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: gacha_machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: gear_item_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: integer
                  defaultValue: 1000
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: integer
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: gacha_machine_item
            baseColumnNames: gacha_machine_id
            constraintName: fk_gacha_machine_item_machine
            referencedTableName: gacha_machine
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: gacha_machine_item
            baseColumnNames: gear_item_id
            constraintName: fk_gacha_machine_item_gear_item
            referencedTableName: gear_item
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: gacha_machine_item
            columnNames: gacha_machine_id, gear_item_id
            constraintName: uq_gacha_machine_item_machine_gear
        - createIndex:
            tableName: gacha_machine_item
            indexName: idx_gacha_machine_item_machine_id
            columns:
              - column:
                  name: gacha_machine_id
      rollback:
        - dropTable:
            tableName: gacha_machine_item

  - changeSet:
      id: add-gear-item-image-url-and-category
      author: sleepkqq
      changes:
        - addColumn:
            tableName: gear_item
            columns:
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: category
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: gear_item
            columnName: image_url
        - dropColumn:
            tableName: gear_item
            columnName: category
