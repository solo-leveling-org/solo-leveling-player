databaseChangeLog:
  - changeSet:
      id: gear-item-stats-to-multipliers
      author: sleepkqq
      changes:
        - renameColumn:
            tableName: gear_item
            oldColumnName: strength
            newColumnName: strength_multiplier
            columnDataType: numeric(4,2)
        - renameColumn:
            tableName: gear_item
            oldColumnName: agility
            newColumnName: agility_multiplier
            columnDataType: numeric(4,2)
        - renameColumn:
            tableName: gear_item
            oldColumnName: intelligence
            newColumnName: intelligence_multiplier
            columnDataType: numeric(4,2)
        - modifyDataType:
            tableName: gear_item
            columnName: strength_multiplier
            newDataType: numeric(4,2)
        - modifyDataType:
            tableName: gear_item
            columnName: agility_multiplier
            newDataType: numeric(4,2)
        - modifyDataType:
            tableName: gear_item
            columnName: intelligence_multiplier
            newDataType: numeric(4,2)
        - sql:
            sql: >
              UPDATE gear_item
              SET strength_multiplier = 1.00,
                  agility_multiplier = 1.00,
                  intelligence_multiplier = 1.00
              WHERE strength_multiplier = 0
                AND agility_multiplier = 0
                AND intelligence_multiplier = 0
      rollback:
        - sql:
            sql: >
              UPDATE gear_item
              SET strength_multiplier = 0,
                  agility_multiplier = 0,
                  intelligence_multiplier = 0
              WHERE strength_multiplier = 1.00
                AND agility_multiplier = 1.00
                AND intelligence_multiplier = 1.00
        - modifyDataType:
            tableName: gear_item
            columnName: strength_multiplier
            newDataType: integer
        - modifyDataType:
            tableName: gear_item
            columnName: agility_multiplier
            newDataType: integer
        - modifyDataType:
            tableName: gear_item
            columnName: intelligence_multiplier
            newDataType: integer
        - renameColumn:
            tableName: gear_item
            oldColumnName: strength_multiplier
            newColumnName: strength
            columnDataType: integer
        - renameColumn:
            tableName: gear_item
            oldColumnName: agility_multiplier
            newColumnName: agility
            columnDataType: integer
        - renameColumn:
            tableName: gear_item
            oldColumnName: intelligence_multiplier
            newColumnName: intelligence
            columnDataType: integer
