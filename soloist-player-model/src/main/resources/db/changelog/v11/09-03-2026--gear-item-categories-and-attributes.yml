databaseChangeLog:
  - changeSet:
      id: gear-item-equipment-columns
      author: sleepkqq
      changes:
        - addColumn:
            tableName: gear_item
            columns:
              - column:
                  name: damage
                  type: numeric(10,2)
              - column:
                  name: element
                  type: integer
              - column:
                  name: gear_set
                  type: integer

        - dropColumn:
            tableName: gear_item
            columnName: category

      rollback:
        - addColumn:
            tableName: gear_item
            columns:
              - column:
                  name: category
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
        - dropColumn:
            tableName: gear_item
            columnName: damage
        - dropColumn:
            tableName: gear_item
            columnName: element
        - dropColumn:
            tableName: gear_item
            columnName: gear_set

  - changeSet:
      id: create-player-consumable-table
      author: sleepkqq
      changes:
        - createTable:
            tableName: player_consumable
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: player_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: consumable_type
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: integer
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: player_consumable
            baseColumnNames: player_id
            constraintName: fk_player_consumable_player
            referencedTableName: players
            referencedColumnNames: id

        - addUniqueConstraint:
            tableName: player_consumable
            columnNames: player_id, consumable_type
            constraintName: uq_player_consumable

      rollback:
        - dropTable:
            tableName: player_consumable
