spring:
  application:
    name: soloist-player
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
  datasource:
    url: jdbc:postgresql://localhost:5432/soloist
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PlayerHikariCP
  liquibase:
    enabled: true
    default-schema: player
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2000
      timeout: 2000
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms
          time-between-eviction-runs: 30s
  grpc:
    server:
      port: 11001
  profiles:
    include: jimmer
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: -1
    fallback-to-system-locale: false
app:
  grpc:
    services:
      agent:
        host: localhost
        port: 11003
  scheduler:
    daily-tasks-updater:
      enabled: true
      cron: "0 0 0 * * *"
  player:
    limits:
      free:
        tasks:
          max: 5
        stamina:
          max: 100
          regen-rate: 1
          regen-interval-seconds: 720
      premium:
        tasks:
          max: 10
        stamina:
          max: 100
          regen-rate: 1
          regen-interval-seconds: 360
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 10001
