apiVersion: apps/v1
kind: Deployment
metadata:
  name: soloist-player
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: soloist-player
  template:
    metadata:
      labels:
        app: soloist-player
      annotations:
        commit.sha: "${IMAGE_TAG}"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: app
          image: $DEPLOY_IMAGE
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          env:
            - name: POSTGRES_USER
              value: "${POSTGRES_USER}"
            - name: POSTGRES_PASSWORD
              value: "${POSTGRES_PASSWORD}"
            - name: OPENROUTER_TOKEN
              value: "${OPENROUTER_TOKEN}"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5